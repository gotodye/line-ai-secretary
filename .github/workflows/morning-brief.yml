name: Morning Brief

# 每天早上推播晨間簡報。先確實叫醒服務，再觸發簡報，
# 所以就算服務原本是睡的、或 keep-alive 剛好漏了幾次，也不受影響。
on:
  schedule:
    # 台北 06:47（UTC 22:47）。GitHub 排程常延遲 15-60 分鐘，且整點／熱門
    # 時間最嚴重，所以刻意提早、並用冷門的 :47 分鐘來壓低佇列延遲，讓實際
    # 送達大致落在 07:00-07:45 之間，而非飄到 8 點多。
    - cron: "47 22 * * *"
    # 備援：台北 07:17。GitHub 偶爾配不到 runner 導致整個 job 沒跑起來，
    # 這時第二次觸發補上。伺服器端有「當天已寄就跳過」的冪等判斷，正常日子
    # 第一次已寄，這次自動變無動作，不會重複打擾。
    - cron: "17 23 * * *"
  workflow_dispatch: {}

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Wake service (等滿冷啟動)
        run: |
          echo "喚醒服務，等待冷啟動完成…"
          curl -fsS --max-time 120 \
            --retry 6 --retry-all-errors --retry-delay 15 \
            https://line-ai-secretary-gvxw.onrender.com/ping
          echo "服務已就緒"

      - name: Trigger brief (帶密碼觸發)
        run: |
          # 手動觸發（測試）帶 force=1 強制重寄；排程觸發維持冪等（當天已寄就跳過）。
          URL="https://line-ai-secretary-gvxw.onrender.com/cron/brief"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${URL}?force=1"
          fi
          echo "觸發晨間簡報… ($URL)"
          curl -fsS --max-time 60 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "$URL"
          echo "已受理，簡報將於背景推播到 LINE"

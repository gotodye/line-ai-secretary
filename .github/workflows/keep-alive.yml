name: Keep Alive

# 讓 Render 免費服務在活躍時段保持清醒。
# 用 curl 而非 cron-job.org：curl 會等滿冷啟動、對 503 自動重試，
# 真正把睡著的服務叫醒；cron-job.org 只等一兩秒拿到 503 就放棄，叫不醒。
on:
  schedule:
    # 每 10 分鐘，但只在台北 06:00–01:00（UTC 0-17,22,23）。
    # 台北 01:00–06:00 不打，讓服務休眠、節省 Render 免費時數。
    - cron: "*/10 0-17,22,23 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ping
        run: |
          curl -fsS --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 20 \
            https://line-ai-secretary-gvxw.onrender.com/ping
